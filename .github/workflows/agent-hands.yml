name: Agent Hands

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: agent-hands-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.label.name == 'vibe-run' &&
      github.event.issue.user.login == 'priest1313'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run commands from issue and report back
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/agent-hands/hands.py
